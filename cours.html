<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/css/styles.css">
        <link rel="stylesheet" href="assets/css/cours.css">
        <link href='https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css' rel='stylesheet'>
        <title>Cours &amp; Révisions - Rohan ALAMELOU</title>
    </head>
    <body>
        <div class="animated-dots" aria-hidden="true"></div>

        <!--===== HEADER =====-->
        <header class="l-header">
            <nav class="nav bd-grid">
                <div>
                    <a href="index.html" class="nav__logo">Rohan ALAMELOU</a>
                </div>
                <div class="nav__menu" id="nav-menu">
                    <ul class="nav__list">
                        <li class="nav__item"><a href="index.html#home" class="nav__link">Accueil</a></li>
                        <li class="nav__item"><a href="index.html#about" class="nav__link">Profil</a></li>
                        <li class="nav__item"><a href="index.html#skills" class="nav__link">Compétences</a></li>
                        <li class="nav__item"><a href="index.html#experience-details" class="nav__link">Projets</a></li>
                        <li class="nav__item"><a href="cours.html" class="nav__link active-link">Cours</a></li>
                        <li class="nav__item"><a href="index.html#contact" class="nav__link">Contact</a></li>
                    </ul>
                </div>
                <div class="nav__toggle" id="nav-toggle">
                    <i class='bx bx-menu'></i>
                </div>
            </nav>
        </header>

        <main class="l-main">
            <!--===== EN-TÊTE DU HUB =====-->
            <section class="hub section bd-grid">
                <div class="hub__intro">
                    <h1 class="hub__title">Cours &amp; <span class="hub__title-color">Révisions</span></h1>
                    <p class="hub__formation" id="hub-formation"></p>
                    <p class="hub__lead">Mes fiches, exercices et supports de révision, rangés par matière.</p>
                    <div class="hub__stats" id="hub-stats"></div>
                    <p class="hub__next-exam" id="hub-next-exam" hidden></p>
                </div>

                <!--===== RECHERCHE + FILTRES =====-->
                <div class="hub__toolbar">
                    <label class="hub__search">
                        <i class='bx bx-search'></i>
                        <input type="search" id="hub-search" placeholder="Rechercher une fiche ou une matière…" autocomplete="off">
                    </label>
                    <div class="hub__filters" id="hub-filters" role="group" aria-label="Filtrer par matière"></div>
                </div>

                <!--===== MATIÈRES (générées par assets/js/cours.js) =====-->
                <div class="hub__grid" id="hub-grid"></div>
                <p class="hub__empty" id="hub-empty" hidden>Aucun résultat.</p>
            </section>
        </main>

        <!--===== FOOTER =====-->
        <footer class="footer">
            <p class="footer__title">Rohan ALAMELOU</p>
            <div class="footer__social"></div>
            <p class="footer__copy">&#169; Rohan ALAMELOU. Tous droits réservés</p>
        </footer>

        <script src="assets/js/cours-data.js"></script>
        <script src="assets/js/cours.js"></script>
    </body>
</html>
